<p-toast />
<p-confirmdialog />

<div class="page-header">
	<h1 class="page-title">Competitors</h1>
	<p-button label="Add Competitor" icon="pi pi-plus" (onClick)="openCreateDialog()" />
</div>

<p-table [value]="competitors" [paginator]="true" [rows]="10" [tableStyle]="{ 'min-width': '100%' }">
	<ng-template pTemplate="header">
		<tr>
			<th>Name</th>
			<th>Website URL</th>
			<th>Description</th>
			<th>Status</th>
			<th>Created At</th>
			<th style="width: 230px">Actions</th>
		</tr>
	</ng-template>
	<ng-template pTemplate="body" let-competitor>
		<tr>
			<td><strong>{{ competitor.name }}</strong></td>
			<td>
				<a [href]="competitor.websiteUrl" target="_blank" rel="noopener noreferrer">{{ competitor.websiteUrl }}</a>
			</td>
			<td>{{ truncateDescription(competitor.description) }}</td>
			<td>
				<p-tag [value]="competitor.isActive ? 'Active' : 'Inactive'" [severity]="competitor.isActive ? 'success' : 'danger'" />
			</td>
			<td>{{ competitor.createdAt | date: 'mediumDate' }}</td>
			<td>
				<div class="action-buttons">
					  <p-button icon="pi pi-play" [outlined]="true" (onClick)="runAgents(competitor)" />
					  <p-button icon="pi pi-pencil" [outlined]="true" (onClick)="openEditDialog(competitor)" />
					  <p-button icon="pi pi-trash" severity="danger" [outlined]="true" (onClick)="confirmDelete(competitor)" />
				</div>
			</td>
		</tr>
	</ng-template>
</p-table>

<p-dialog
	[header]="isEditMode ? 'Edit Competitor' : 'Add Competitor'"
	[modal]="true"
	[(visible)]="dialogVisible"
	[style]="{ width: '520px' }"
>
	<form [formGroup]="competitorForm" class="competitor-form">
		<label for="name">Name *</label>
		<input id="name" pInputText formControlName="name" />

		<label for="websiteUrl">Website URL *</label>
		<input id="websiteUrl" pInputText formControlName="websiteUrl" />

		<label for="description">Description</label>
		<textarea id="description" pTextarea rows="4" formControlName="description"></textarea>
	</form>

	<ng-template pTemplate="footer">
		<p-button label="Cancel" severity="secondary" (onClick)="dialogVisible = false" />
		<p-button label="Save" icon="pi pi-check" [loading]="saving" (onClick)="saveCompetitor()" />
	</ng-template>
</p-dialog>
