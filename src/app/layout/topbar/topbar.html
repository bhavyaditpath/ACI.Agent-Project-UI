<div class="topbar">
	<p-toolbar>
		<ng-template #start>
			<div class="brand-group">
				<div class="brand-icon">
					<i class="pi pi-sparkles"></i>
				</div>
				<div class="brand-info">
					<span class="brand-name">RivalRadar</span>
					<span class="brand-subtitle">COMPETITIVE INTELLIGENCE COMMAND CENTER</span>
				</div>
				<p-tag value="Live" severity="success" [rounded]="true" styleClass="live-tag" />
			</div>
		</ng-template>

		<ng-template #end>
			<div class="topbar-actions">
				<!-- Action Button -->
				<p-button
					*ngIf="isAdmin"
					label="Run All Agents"
					icon="pi pi-play"
					styleClass="run-agents-action"
					[loading]="runningAll"
					(onClick)="runAllAgents()"
				/>

				<div class="v-divider"></div>

				<!-- User Profile Section -->
				<div class="user-profile-section">
					<div class="user-avatar">
						{{ (currentUser?.username || 'U')[0].toUpperCase() }}
					</div>
					<div class="user-details">
						<div class="user-name">{{ currentUser?.username }}</div>
						<div class="user-role">{{ currentUser?.role }}</div>
					</div>
					<p-button
						icon="pi pi-sign-out"
						styleClass="logout-btn"
						[rounded]="true"
						[text]="true"
						pTooltip="Sign Out"
						tooltipPosition="bottom"
						(onClick)="onLogout()"
					/>
				</div>

				<p-button
					styleClass="menu-toggle-btn"
					[icon]="isDrawerOpen() ? 'pi pi-times' : 'pi pi-bars'"
					[outlined]="true"
					(onClick)="toggleMenu()"
				/>
			</div>
		</ng-template>
	</p-toolbar>
</div>
