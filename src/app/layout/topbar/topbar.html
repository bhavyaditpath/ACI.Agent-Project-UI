<div class="topbar">
	<p-toolbar>
		<ng-template #start>
			<div class="brand-group">
				<div class="brand-icon">
					<i class="pi pi-sparkles"></i>
				</div>
				<div class="brand-info">
					<span class="brand-name">RivalRadar</span>
					<span class="brand-subtitle">COMPETITIVE INTELLIGENCE COMMAND CENTER</span>
				</div>
				<p-tag value="Live" severity="success" [rounded]="true" styleClass="live-tag" />
			</div>
		</ng-template>

		<ng-template #end>
			<div class="topbar-actions">
				<!-- Action Button -->
				<p-button
					*ngIf="isAdmin"
					label="Run All Agents"
					icon="pi pi-play"
					styleClass="run-agents-action"
					[loading]="runningAll"
					(onClick)="runAllAgents()"
				/>

				<div class="v-divider"></div>

				<!-- User Section -->
				<div class="user-info-group">
					<span class="user-label">{{ currentUser?.username }}</span>
					<p-tag 
						[value]="currentUser?.role" 
						severity="info"
						[rounded]="true"
						styleClass="user-tag"
					/>
				</div>

				<!-- Logout -->
				<p-button
					icon="pi pi-sign-out"
					styleClass="logout-action-btn"
					[text]="true"
					pTooltip="Logout"
					tooltipPosition="bottom"
					(onClick)="onLogout()"
				/>

				<p-button
					styleClass="menu-toggle-btn"
					[icon]="isDrawerOpen() ? 'pi pi-times' : 'pi pi-bars'"
					[outlined]="true"
					(onClick)="toggleMenu()"
				/>
			</div>
		</ng-template>
	</p-toolbar>
</div>
