<p-toast />

<div class="topbar">
	<p-toolbar>
		<ng-template #start>
			<div class="brand-wrap">
				<div class="brand-mark">
					<i class="pi pi-sparkles"></i>
				</div>
				<div>
					<div class="topbar-logo">RivalRadar</div>
					<div class="topbar-subtitle">Competitive intelligence command center</div>
				</div>
				<p-tag value="Live" severity="success" />
			</div>
		</ng-template>
		<ng-template #end>
			<div class="topbar-actions">
				<!-- Admin Action -->
				<p-button
					*ngIf="isAdmin"
					label="Run All Agents"
					icon="pi pi-play"
					[loading]="runningAll"
					(onClick)="runAllAgents()"
					styleClass="p-button-sm p-button-secondary run-all-btn"
				/>

				<div class="user-profile" *ngIf="currentUser">
					<div class="user-avatar">
						{{ currentUser.username.charAt(0).toUpperCase() }}
					</div>
					<div class="user-details">
						<span class="user-name">{{ currentUser.username }}</span>
						<span class="user-role">{{ isAdmin ? 'Administrator' : 'Viewer' }}</span>
					</div>
				</div>

				<p-button
					icon="pi pi-power-off"
					severity="danger"
					[text]="true"
					pTooltip="Sign Out"
					tooltipPosition="bottom"
					(onClick)="onLogout()"
					styleClass="logout-btn"
				/>

				<p-button
					styleClass="menu-toggle-btn"
					[icon]="isDrawerOpen() ? 'pi pi-times' : 'pi pi-bars'"
					[outlined]="true"
					ariaLabel="Toggle navigation menu"
					(onClick)="toggleMenu()"
				/>
			</div>
		</ng-template>
	</p-toolbar>
</div>
