<aside class="sidebar" [class.sidebar-open]="mobileOpen()" (click)="onSidebarClick($event)">
	<div class="sidebar-hero">
		<div class="sidebar-kicker">Workspace</div>
		<div class="sidebar-title">Intelligence suite</div>
		<p>Monitor competitor movement, signals, and weekly reporting from one control panel.</p>
	</div>
	<div class="sidebar-menu">
		<a *ngFor="let item of visibleItems" 
		   [routerLink]="item.routerLink"
		   routerLinkActive="active"
		   [routerLinkActiveOptions]="{ exact: true }"
		   class="menu-item">
			<i [class]="item.icon"></i>
			<span>{{ item.label }}</span>
		</a>
	</div>

	<!-- <div class="sidebar-footer">
		<p-button

			[text]="true"
			styleClass="w-full sidebar-logout-btn"
			(onClick)="onLogout()"
		/>
	</div> -->
</aside>
